name: CI

# semdev's first CI. Until this landed, every quality claim on a PR was a claim
# about a command someone ran on a laptop (see #25) — this makes the floor
# mechanical instead of remembered.
#
# Deliberately runs NO e2e. `task e2e` needs real docker, takes ~8.5 minutes,
# and carries traps a naive invocation inherits (the test cache, Go's 600s
# default). It gets its own workflow once #22 lands and `task e2e` is honest by
# default. This workflow is docker-free and finishes in a couple of minutes.
#
# Every job shells out to the Taskfile rather than re-spelling its commands.
# semdev's house gate is `task check`; a workflow that re-implements those
# commands can drift from it silently, which is the exact failure class CI is
# supposed to close.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  # Pinned so a new CLI release cannot change validation semantics without a
  # deliberate bump here.
  OPENSPEC_VERSION: "1.7.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # revive is pinned through go.mod's `tool` directive, so `go tool revive`
      # resolves the module's version and a new upstream release cannot fail
      # this build on new ruleset warnings with no code change. This step
      # catches the other half: setup-go's cache can serve a stale binary that
      # disagrees with the current pin. One grep turns silent drift into a loud
      # failure.
      - name: Sanity-check revive matches the go.mod pin
        run: |
          expected=$(awk '/github.com\/mgechev\/revive v/ {print $2}' go.mod | head -1)
          actual_raw=$(go tool revive --version 2>&1 | head -1 | awk '{print $NF}')
          expected="${expected#v}"
          actual="${actual_raw#v}"
          if [ "$expected" != "$actual" ]; then
            echo "FAIL: revive mismatch — go.mod pin: $expected, go tool: $actual_raw"
            exit 1
          fi
          echo "OK: revive $actual matches the go.mod pin"

      - name: Lint (vet, gofmt, revive — warnings are failures)
        run: task lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # `task test` is `go test -race ./...` — genuinely unit now, and mechanically
      # kept that way. It excludes ./test/e2e (build tag `e2e`) and every
      # infrastructure-gated test (build tag `integration`), so it needs neither a
      # docker daemon nor a live NATS, and spends no tokens.
      #
      # It did NOT used to be true. Eleven docker-backed tests sat untagged in
      # internal/{cleanroom,coldproof,tools/provisionsandbox} and rode in this job,
      # where `go test ./...` ran them in parallel until a per-user kernel resource
      # ran out. test/conformance's TestInfraGatedTestsCarryTheIntegrationTag now
      # fails the build if an infra-gated test reappears here, so this comment cannot
      # quietly become false again.
      - name: Unit and conformance suite (race)
        run: task test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # The infrastructure-gated tests: real docker containers, real NATS. `task
      # test:integration` resets NATS first, runs with -p 1 so container-spawning
      # packages do not compete, and reaps sandbox images on the way out even if the
      # run fails.
      - name: Infrastructure-gated tests (docker + NATS)
        run: task test:integration

      - name: Disk and docker state after
        if: always()
        run: |
          df -h / | tail -1
          docker system df || true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Build all packages
        run: task build

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenSpec CLI (pinned)
        run: npm install -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}

      # semdev archives a change in the PR that lands it, which promotes that
      # change's deltas into openspec/specs/. So the canonical specs must be
      # validated on the same PR that changes them — not later, and not only
      # when someone remembers to type it.
      - name: Validate all changes and specs (strict)
        run: openspec validate --all --strict --no-interactive

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, test, build, openspec, integration]
    if: always()
    steps:
      # ONE required check to protect the branch with. Without this aggregator,
      # branch protection has to name each job individually, and a job added
      # later is silently not required — green because nobody wired it up.
      - name: Check every job succeeded
        run: |
          failed=""
          [[ "${{ needs.lint.result }}"     == "success" ]] || failed="$failed lint"
          [[ "${{ needs.test.result }}"     == "success" ]] || failed="$failed test"
          [[ "${{ needs.build.result }}"    == "success" ]] || failed="$failed build"
          [[ "${{ needs.openspec.result }}" == "success" ]] || failed="$failed openspec"
          [[ "${{ needs.integration.result }}" == "success" ]] || failed="$failed integration"
          if [ -n "$failed" ]; then
            echo "FAILED jobs:$failed"
            exit 1
          fi
          echo "All CI jobs passed"
